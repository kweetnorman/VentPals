<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5efff"><title>Protect Your Nest • VentPals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Poppins,system-ui,sans-serif;color:#38264f;background:linear-gradient(135deg,#f4eaff,#effaf2 58%,#fff7df)}main{width:min(100%,480px);background:#ffffffed;border:1px solid #e9def6;border-radius:28px;padding:clamp(22px,5vw,32px);box-shadow:0 18px 55px #49336a18}h1{text-align:center;color:#7549b3;margin:0 0 8px;font-size:26px}p{text-align:center;color:#716780;font-size:14px;line-height:1.6}.identity{margin:18px 0;padding:16px;border-radius:18px;background:linear-gradient(135deg,#f7efff,#effaf2);text-align:center}.identity small{display:block;color:#76688a;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.identity strong{display:block;color:#6740a0;font-size:clamp(20px,5vw,26px);overflow-wrap:anywhere;margin-top:4px}label{display:block;font-size:13px;font-weight:700;color:#5b4776;margin:16px 0 6px}input{width:100%;padding:13px 14px;border:2px solid #e5d9f2;border-radius:13px;font:500 16px Poppins}.pin{text-align:center;letter-spacing:.45em;font-size:21px}.primary{width:100%;border:0;border-radius:999px;padding:14px;margin-top:22px;background:linear-gradient(110deg,#8d5ac5,#62b98a);color:white;font:800 15px Poppins;cursor:pointer}.error{display:none;background:#fff0f0;color:#a12e42;padding:10px 12px;border-radius:12px;font-size:12px;margin:12px 0}.error.show{display:block}.hint{font-size:11px;color:#847a90;margin-top:5px}
</style>
</head><body><main>
<div style="text-align:center;font-size:48px" aria-hidden="true">🪺</div>
<h1>Protect Your Nest!</h1>
<p>Your personal VentPals name is already your username. You only need to create a 4-digit secret PIN so you can return to your Nest.</p>
<div class="identity"><small>Your VentPals username</small><strong id="personalName">Loading your name…</strong></div>
<form id="accountForm" novalidate><div id="errorBox" class="error" role="alert"></div>
<label for="pin">Create your 4-digit secret PIN</label><input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" placeholder="••••" required>
<label for="confirmPin">Enter your PIN again</label><input class="pin" id="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" placeholder="••••" required>
<button class="primary" type="submit">Create My PIN & Enter My Nest 🐦</button></form>
</main>
<script>
(function(){
 const $=id=>document.getElementById(id);
 let user={};try{user=JSON.parse(localStorage.getItem('ventpals_user')||'{}')}catch(e){}
 const personalName=String(user.displayName||'').trim().replace(/\s+/g,' ');
 if(!user.birdLocked||!user.namesLocked||!personalName){location.replace('onboarding/onboarding.html');return}
 $('personalName').textContent=personalName;
 function error(message){$('errorBox').textContent=message;$('errorBox').classList.add('show')}
 $('accountForm').addEventListener('submit',function(e){
  e.preventDefault();$('errorBox').classList.remove('show');
  const pin=$('pin').value.trim(),confirm=$('confirmPin').value.trim();
  if(!/^\d{4}$/.test(pin)){error('Your secret PIN must be exactly 4 numbers.');return}
  if(pin!==confirm){error('Those PINs do not match. Try again.');return}
  let profiles=[];try{profiles=JSON.parse(localStorage.getItem('ventpals_demo_profiles')||'[]')}catch(e){}
  const key=personalName.toLocaleLowerCase();
  if(profiles.some(p=>String(p.username||'').trim().replace(/\s+/g,' ').toLocaleLowerCase()===key)){error('This VentPals name is already in use on this device.');return}
  if(profiles.length){error('This development preview currently supports one child demo profile per browser.');return}
  user.username=personalName;user.hasPin=true;user.demoProfile=true;
  const pinHash=btoa(pin),profile={username:personalName,pinHash,user,onboardingComplete:true};
  profiles.push(profile);
  localStorage.setItem('ventpals_demo_profiles',JSON.stringify(profiles));
  localStorage.setItem('ventpals_user',JSON.stringify(user));
  localStorage.setItem('ventpals_pin_hash',pinHash);
  localStorage.setItem('ventpals_logged_in','true');
  localStorage.setItem('ventpals_development_mode','true');
  localStorage.setItem('ventpals_onboarding_complete','true');
  location.href='nest.html';
 });
})();
</script></body></html>
