<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5efff"><title>Create Your VentPals Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Poppins,system-ui,sans-serif;color:#38264f;background:linear-gradient(135deg,#f4eaff,#effaf2 58%,#fff7df)}main{width:min(100%,480px);background:#ffffffed;border:1px solid #e9def6;border-radius:28px;padding:clamp(22px,5vw,32px);box-shadow:0 18px 55px #49336a18}h1{text-align:center;color:#7549b3;margin:0 0 8px;font-size:26px}p{text-align:center;color:#716780;font-size:14px;line-height:1.6}label{display:block;font-size:13px;font-weight:700;color:#5b4776;margin:16px 0 6px}input{width:100%;padding:13px 14px;border:2px solid #e5d9f2;border-radius:13px;font:500 16px Poppins}.pin{text-align:center;letter-spacing:.45em;font-size:21px}.primary{width:100%;border:0;border-radius:999px;padding:14px;margin-top:22px;background:linear-gradient(110deg,#8d5ac5,#62b98a);color:white;font:800 15px Poppins;cursor:pointer}.error{display:none;background:#fff0f0;color:#a12e42;padding:10px 12px;border-radius:12px;font-size:12px;margin:12px 0}.error.show{display:block}.hint{font-size:11px;color:#847a90;margin-top:5px}
</style>
</head><body><main>
<div style="text-align:center;font-size:48px">🪺</div><h1>Your Nest is ready!</h1>
<p>One last step. Choose a username and a 4-digit secret PIN so you can return to your Nest next time.</p>
<form id="accountForm" novalidate><div id="errorBox" class="error" role="alert"></div>
<label for="username">Your username</label><input id="username" maxlength="24" autocomplete="username" placeholder="Choose 3–24 characters" required><div class="hint">Use letters, numbers, dots, dashes, or underscores. This is your sign-in name.</div>
<label for="pin">Create your 4-digit secret PIN</label><input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" placeholder="••••" required>
<label for="confirmPin">Confirm your PIN</label><input class="pin" id="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" placeholder="••••" required>
<button class="primary" type="submit">Create My Login & Enter My Nest 🐦</button></form>
</main>
<script>
(function(){
 const $=id=>document.getElementById(id);
 let user={};try{user=JSON.parse(localStorage.getItem('ventpals_user')||'{}')}catch(e){}
 if(!user.birdLocked||!user.namesLocked||!user.displayName){location.replace('onboarding/onboarding.html');return}
 function error(message){$('errorBox').textContent=message;$('errorBox').classList.add('show')}
 $('accountForm').addEventListener('submit',function(e){
  e.preventDefault();$('errorBox').classList.remove('show');
  const username=$('username').value.trim(),pin=$('pin').value.trim(),confirm=$('confirmPin').value.trim();
  if(!/^[A-Za-z0-9._-]{3,24}$/.test(username)){error('Choose a username with 3–24 letters, numbers, dots, dashes, or underscores.');return}
  if(!/^\d{4}$/.test(pin)){error('Your secret PIN must be exactly 4 numbers.');return}
  if(pin!==confirm){error('Those PINs do not match. Try again.');return}
  let profiles=[];try{profiles=JSON.parse(localStorage.getItem('ventpals_demo_profiles')||'[]')}catch(e){}
  if(profiles.some(p=>String(p.username).toLowerCase()===username.toLowerCase())){error('That username is already in use on this device. Choose another one.');return}
  if(profiles.length){error('This development preview currently supports one child demo profile per browser.');return}
  user.username=username;user.hasPin=true;user.demoProfile=true;
  const pinHash=btoa(pin),profile={username,pinHash,user,onboardingComplete:true};
  profiles.push(profile);
  localStorage.setItem('ventpals_demo_profiles',JSON.stringify(profiles));
  localStorage.setItem('ventpals_user',JSON.stringify(user));
  localStorage.setItem('ventpals_pin_hash',pinHash);
  localStorage.setItem('ventpals_logged_in','true');
  localStorage.setItem('ventpals_development_mode','true');
  localStorage.setItem('ventpals_onboarding_complete','true');
  location.href='nest.html';
 });
})();
</script></body></html>
