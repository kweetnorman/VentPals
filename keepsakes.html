<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keepsakes – VentPals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom right, #F7F4FF, #f0f9ff); }
    dialog { border: none; border-radius: 24px; padding: 0; max-width: 92vw; width: 420px; box-shadow: 0 20px 60px rgba(46,26,71,.35); }
    dialog::backdrop { background: rgba(46,26,71,.45); }
  </style>
</head>
<body class="text-gray-800">
  <script>if(localStorage.getItem('ventpals_logged_in')!=='true'){window.location.replace('login.html');}</script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/growth.js"></script>
  <script src="assets/js/shop-config.js"></script>
  <script src="assets/js/keepsakes.js"></script>

  <main class="max-w-3xl mx-auto px-4 pt-8 pb-10 space-y-8">
    <header class="text-center">
      <h1 class="text-3xl font-bold text-purple-700">Keepsakes</h1>
      <p class="text-gray-600 text-sm max-w-md mx-auto mt-2">Real VentPals gear you earn by growing. Spend feathers, and your grown-up gets your request.</p>
      <div class="inline-flex items-center gap-3 bg-white rounded-full shadow px-5 py-2 mt-4">
        <span class="text-xl" aria-hidden="true">🪶</span>
        <span><b id="feathers" class="text-purple-700 text-lg">0</b> <span class="text-sm text-gray-500">feathers to spend</span></span>
        <a href="rewards.html" class="text-sm font-semibold text-purple-700 underline">How to earn more</a>
      </div>
    </header>

    <section aria-label="Keepsakes you can ask for">
      <div id="shop" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
    </section>

    <section class="bg-white rounded-3xl shadow p-6">
      <h2 class="text-lg font-bold text-purple-700 mb-3">My requests</h2>
      <ul id="myRequests" class="space-y-2 text-sm"></ul>
      <p id="noRequests" class="text-sm text-gray-500">You haven't asked for anything yet.</p>
    </section>

    <p class="text-center text-xs text-gray-500">Grown-ups can also shop any time at <a class="underline text-purple-700" href="https://keepsakes.ventpals.com" target="_blank" rel="noopener">keepsakes.ventpals.com</a>.</p>
  </main>

  <dialog id="askDialog" aria-labelledby="askTitle">
    <div class="p-6">
      <h2 id="askTitle" class="text-xl font-bold text-purple-700 mb-1">Ask your grown-up?</h2>
      <p id="askBody" class="text-sm text-gray-600 mb-4"></p>
      <label for="askNote" class="block text-xs font-semibold text-gray-600 mb-1">Add a note (optional)</label>
      <input id="askNote" maxlength="140" class="w-full border border-purple-300 rounded-xl px-3 py-2 text-sm mb-4" placeholder="I earned this by practicing breathing!">
      <p id="askErr" class="text-sm text-red-600 mb-3 hidden" role="alert"></p>
      <div class="flex gap-3">
        <button id="askCancel" class="flex-1 bg-gray-100 hover:bg-gray-200 font-bold py-3 rounded-full text-sm">Not now</button>
        <button id="askSend" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-full text-sm">Send request</button>
      </div>
    </div>
  </dialog>

  <script>
    (function () {
      var G = window.VPGrowth, S = window.VPShop, current = null;
      var $ = function (id) { return document.getElementById(id); };
      var STATUS = {
        requested: ['Waiting for your grown-up', 'bg-yellow-100 text-yellow-800'],
        approved:  ['Approved! Your grown-up is ordering it', 'bg-green-100 text-green-800'],
        ordered:   ['Ordered 🎉', 'bg-green-100 text-green-800'],
        declined:  ['Not this time. Feathers returned', 'bg-gray-100 text-gray-600']
      };

      function render() {
        var fe = G.getFeathers(); $('feathers').textContent = fe.balance;
        var shop = $('shop'); shop.innerHTML = '';
        S.config.items.forEach(function (it) {
          var req = S.activeFor(it.id), can = fe.balance >= it.cost;
          var card = document.createElement('div');
          card.className = 'bg-white rounded-3xl shadow overflow-hidden flex flex-col';
          var action;
          if (req) action = '<p class="text-center text-xs font-bold rounded-full py-2 ' + STATUS[req.status][1] + '">' + STATUS[req.status][0] + '</p>';
          else if (can) action = '<button data-ask="' + it.id + '" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-full text-sm">Ask my grown-up</button>';
          else action = '<div><div class="w-full bg-purple-100 rounded-full h-3 overflow-hidden"><div class="bg-purple-400 h-3 rounded-full" style="width:' + Math.max(4, Math.round(fe.balance / it.cost * 100)) + '%"></div></div><p class="text-xs text-gray-500 mt-2 text-center">' + (it.cost - fe.balance) + ' more feathers to unlock</p></div>';
          card.innerHTML =
            '<div class="bg-purple-50 h-40 flex items-center justify-center"><img src="' + it.image + '" alt="" class="h-32 object-contain" onerror="this.outerHTML=\'<span style=&quot;font-size:64px&quot;>' + it.emoji + '</span>\'"></div>' +
            '<div class="p-5 flex-1 flex flex-col gap-3"><div class="flex justify-between items-start gap-2"><h3 class="font-bold text-purple-700">' + it.name + '</h3><span class="text-sm font-bold text-purple-600 whitespace-nowrap">🪶 ' + it.cost + '</span></div>' +
            '<p class="text-gray-500 text-sm flex-1">' + it.blurb + '</p>' + action + '</div>';
          shop.appendChild(card);
        });

        var list = $('myRequests'); list.innerHTML = '';
        var reqs = S.requests().slice().reverse();
        $('noRequests').classList.toggle('hidden', reqs.length > 0);
        reqs.forEach(function (r) {
          var li = document.createElement('li'); li.className = 'flex items-center justify-between gap-3 bg-gray-50 rounded-xl px-3 py-2';
          li.innerHTML = '<span class="font-semibold">' + r.name + '</span><span class="text-xs font-bold rounded-full px-3 py-1 ' + STATUS[r.status][1] + '">' + STATUS[r.status][0] + '</span>';
          list.appendChild(li);
        });
      }

      document.addEventListener('click', function (e) {
        var b = e.target.closest('[data-ask]'); if (!b) return;
        current = S.item(b.getAttribute('data-ask'));
        $('askBody').textContent = 'Spend ' + current.cost + ' feathers on the ' + current.name + '. Your grown-up will see your request and decide.';
        $('askNote').value = ''; $('askErr').classList.add('hidden');
        $('askDialog').showModal();
      });
      $('askCancel').onclick = function () { $('askDialog').close(); };
      $('askSend').onclick = function () {
        var r = S.submitRequest(current.id, $('askNote').value);
        if (!r.ok) { $('askErr').textContent = r.error; $('askErr').classList.remove('hidden'); return; }
        $('askDialog').close(); render();
      };
      render();
    })();
  </script>
</body>
</html>
