<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create a Family Account – VentPals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="nav">
        <a class="brand" href="index.html" aria-label="VentPals home"><span class="mark" aria-hidden="true">🐦</span><span>VentPals</span></a>
        <a class="back" href="index.html">← Back</a>
      </div>
    </div>
  </header>

  <main>
    <section class="card" aria-label="Create a family account">
      <div class="card-head">
        <div class="icon" aria-hidden="true">👨‍👩‍👧</div>
        <h1>Create a Family Account</h1>
        <p class="subtitle">A grown-up sets up the account, then adds a profile for each child. Kids never need an email or password.</p>
      </div>

      <form id="signupForm">
        <div id="errorBox" class="alert" role="alert"></div>

        <div class="row2">
          <div>
            <label for="firstName">First name</label>
            <input id="firstName" type="text" autocomplete="given-name" required />
          </div>
          <div>
            <label for="lastName">Last name</label>
            <input id="lastName" type="text" autocomplete="family-name" required />
          </div>
        </div>

        <div>
          <label for="relationship">Your role</label>
          <select id="relationship" required>
            <option value="" disabled selected>Choose one…</option>
            <option>Parent</option>
            <option>Legal guardian</option>
            <option>Grandparent</option>
            <option>Other family caregiver</option>
          </select>
        </div>

        <div>
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="jane@example.com" required />
        </div>

        <div class="row2">
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <div>
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
          </div>
        </div>
        <div class="hint" style="margin-top:-6px;">At least 8 characters.</div>

        <label class="consent" for="consent">
          <input id="consent" type="checkbox" required />
          <span>I am the parent or legal guardian of the children I will add, and I agree to the
            <a class="inline" href="PRIVACY.md" target="_blank" rel="noopener">Privacy Policy</a>.
            I understand VentPals collects only a nickname, an age range, and the child's activity inside the app.</span>
        </label>

        <button class="btn" id="submitBtn" type="submit">Create Account</button>
      </form>

      <div class="foot">
        Already have an account? <a href="adult-login.html">Log in</a>
      </div>
    </section>
  </main>

  <footer>VentPals • Supporting families with emotional growth.</footer>

  <script type="module">
    import { signUpParent, friendlyAuthError } from './assets/js/vp-auth.js';

    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('submitBtn');
    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const password = document.getElementById('password').value;
      if (password.length < 8) { showError('Please choose a password with at least 8 characters.'); return; }
      if (password !== document.getElementById('confirmPassword').value) { showError('The two passwords do not match.'); return; }
      if (!document.getElementById('consent').checked) { showError('Please confirm the parent/guardian consent to continue.'); return; }

      btn.disabled = true;
      try {
        await signUpParent({
          email: document.getElementById('email').value.trim().toLowerCase(),
          password,
          firstName: document.getElementById('firstName').value.trim(),
          lastName: document.getElementById('lastName').value.trim(),
          relationship: document.getElementById('relationship').value,
        });
        window.location.href = 'family.html?welcome=1';
      } catch (err) {
        showError(friendlyAuthError(err));
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
