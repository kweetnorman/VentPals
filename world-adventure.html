<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mimbleton Adventure • VentPals</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <style>
    :root{--ink:#3e2d63;--soft:#6b5a8a;--violet:#7651b5;--card:#fffdfb;--line:#eadcf8}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#f6efff,#eaf6ff);min-height:100vh}
    .shell{max-width:980px;margin:0 auto;padding:14px 14px 110px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .top a{color:var(--violet);font-weight:800;text-decoration:none;font-size:14px}
    .dots{display:flex;gap:8px}
    .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:15px;cursor:pointer;padding:0}
    .dot[aria-current="true"]{border-color:var(--violet);box-shadow:0 0 0 3px rgba(118,81,181,.2)}
    .dot.done{background:#e7f8ec;border-color:#7ccf99}
    .stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:28px;overflow:hidden;box-shadow:0 18px 44px rgba(93,72,133,.22);border:6px solid #fff;background:#cfe8ff center/cover no-repeat;transition:background-image .3s}
    .char{position:absolute;bottom:2%;display:flex;flex-direction:column;align-items:center}
    .char>img{display:block;height:calc(100% - 26px);width:auto;filter:drop-shadow(0 8px 6px rgba(40,20,70,.25))}
    .char .tag{margin-top:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:800;color:var(--violet)}
    #me{left:6%;height:50%}#me img{transform:scaleX(-1)}
    #me>div>img{height:100%!important;width:auto;display:block}
    #host{right:6%;height:50%}
    .hop{animation:hop .5s ease}
    @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
    .title{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.92);border-radius:16px;padding:6px 14px;font-weight:900;font-size:clamp(14px,3vw,20px)}
    .panel{margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 24px rgba(105,78,139,.09)}
    .say{display:flex;gap:12px;align-items:flex-start}
    .say img{width:56px;height:56px;border-radius:30%;object-fit:cover;flex:none;box-shadow:0 3px 10px rgba(93,72,133,.2)}
    .say b{display:block;color:var(--violet);font-size:13px}
    .say p{margin:2px 0 0;font-size:clamp(16px,2.6vw,19px);line-height:1.45;font-weight:600}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .btn{border:0;border-radius:999px;padding:12px 20px;font-weight:900;font-size:15px;cursor:pointer;background:var(--violet);color:#fff;text-decoration:none;display:inline-block;font-family:inherit}
    .btn.alt{background:#f1e8fb;color:var(--violet)}
    .btn.go{background:#2fa766}
    .btn[disabled]{opacity:.45;cursor:default}
    .learned{margin-top:14px;background:#effaf3;border:2px solid #bfe8cd;border-radius:18px;padding:12px 14px;font-weight:700;font-size:15px}
    .act{margin-top:14px}
    .leaves{display:flex;flex-wrap:wrap;gap:10px}
    .leaf{border:0;border-radius:18px;padding:10px 14px;font-weight:900;font-family:inherit;cursor:pointer;color:#3e2d63;font-size:15px}
    #orb{width:120px;height:120px;border-radius:50%;margin:6px auto;background:radial-gradient(circle at 35% 30%,#fff,#b9d9ff);box-shadow:0 0 40px rgba(130,180,255,.6);display:grid;place-items:center;font-weight:900;color:#3e5a8a;transition:transform 4s ease-in-out}
    .fly{position:absolute;width:34px;height:34px;border:0;border-radius:50%;background:radial-gradient(circle,#fff6a8 20%,rgba(255,240,120,.0) 70%);cursor:pointer;animation:drift 4s ease-in-out infinite alternate;padding:0}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(26px,-18px)}}
    .try{display:flex;flex-wrap:wrap;gap:10px}
    .try button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 12px;cursor:pointer;font-weight:800;font-family:inherit;color:var(--ink);display:flex;align-items:center;gap:8px}
    .try button[aria-pressed="true"]{border-color:var(--violet);background:#f1e8fb}
    .wave{font-size:34px;background:none;border:0;cursor:pointer}
    @media(max-width:520px){.dot{width:30px;height:30px}.say img{width:46px;height:46px}}
    @media(prefers-reduced-motion:reduce){.fly,.hop{animation:none}#orb{transition:none}}
  </style>
</head>
<body>
  <script>if(localStorage.getItem('ventpals_logged_in')!=='true'){window.location.replace('welcome.html');}</script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/growth.js"></script>
  <script src="assets/js/feelings.js"></script>
  <script src="assets/js/world-story.js"></script>

  <main class="shell">
    <div class="top">
      <a href="world.html">← Mimbleton map</a>
      <nav class="dots" id="dots" aria-label="Places in Mimbleton"></nav>
    </div>

    <section class="stage" id="stage" aria-live="polite">
      <div class="title" id="title"></div>
      <div class="char" id="host"><img id="hostImg" alt=""><span class="tag" id="hostTag"></span></div>
      <div class="char" id="me"><img id="meImg" alt=""><span class="tag" id="meTag"></span></div>
    </section>

    <section class="panel">
      <div class="say"><img id="sayImg" alt=""><div><b id="sayWho"></b><p id="sayText"></p></div></div>
      <div id="act" class="act" hidden></div>
      <div id="learned" class="learned" hidden></div>
      <div class="row" id="controls"></div>
    </section>
  </main>

  <script>
  (function () {
    'use strict';
    var S = window.VP_STORY, G = window.VPGrowth, FL = window.VPFeelings;
    var KEY = 'ventpals_world_story';
    var $ = function (id) { return document.getElementById(id); };
    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
    function save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
    var prog = load(); prog.visited = prog.visited || {};

    var user = {}; try { user = JSON.parse(localStorage.getItem('ventpals_user') || '{}'); } catch (e) {}
    var bird = G ? G.getBird() : { id: user.birdId || 'aura', name: user.birdName || 'your bird' };
    var stage = G ? G.getProgress().stage.id : 'baby';
    var name = user.displayName || user.nickname || 'friend';
    var fill = function (t) { return String(t).replace(/\{bird\}/g, bird.name).replace(/\{name\}/g, name); };
    var BIRD_NAMES = {}; if (G) { /* host display names */ }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    function art(id, st) { return 'assets/images/' + id + '-' + st + '.png'; }
    function portrait(id) { return 'assets/profile-portraits/' + id + '.png'; }

    var ch = S.chapters, idx = -1, beat = 0, activityDone = false;

    function buildDots() {
      var d = $('dots'); d.innerHTML = '';
      ch.forEach(function (c, i) {
        var b = document.createElement('button'); b.className = 'dot' + (prog.visited[c.id] ? ' done' : ''); b.type = 'button';
        b.title = c.place; b.setAttribute('aria-label', c.place); b.textContent = prog.visited[c.id] ? '✓' : (i + 1);
        if (i === idx) b.setAttribute('aria-current', 'true');
        b.onclick = function () { go(i); };
        d.appendChild(b);
      });
    }
    function setSay(who, id, text) { $('sayWho').textContent = who; $('sayImg').src = portrait(id); $('sayText').textContent = fill(text); }
    function controls(list) {
      var c = $('controls'); c.innerHTML = '';
      list.forEach(function (b) {
        var el = document.createElement(b.href ? 'a' : 'button'); el.className = 'btn' + (b.cls ? ' ' + b.cls : ''); el.textContent = b.label;
        if (b.href) el.href = b.href; else { el.type = 'button'; el.onclick = b.fn; }
        if (b.disabled) el.disabled = true;
        c.appendChild(el);
      });
    }
    function clearAct() { $('act').hidden = true; $('act').innerHTML = ''; $('learned').hidden = true; }

    /* ---------- scenes ---------- */
    function showIntro(step) {
      idx = -1; clearAct(); buildDots();
      $('stage').style.backgroundImage = 'url(assets/world/backgrounds/nesting-tree.jpg)';
      $('title').textContent = S.intro.title;
      $('host').style.display = 'none';
      $('meImg').src = art(bird.id, stage); $('meTag').textContent = bird.name; $('me').style.left = '40%';
      setSay(bird.name, bird.id, S.intro.lines[step]);
      var last = step >= S.intro.lines.length - 1;
      controls([{ label: last ? 'Start exploring' : 'Next', fn: function () { last ? go(firstUnvisited()) : showIntro(step + 1); } }]);
    }
    function firstUnvisited() { for (var i = 0; i < ch.length; i++) if (!prog.visited[ch[i].id]) return i; return 0; }

    function go(i) {
      idx = i; beat = 0; activityDone = false; clearAct();
      var c = ch[i];
      $('stage').style.backgroundImage = 'url(assets/world/backgrounds/' + c.id + '.jpg)';
      $('title').textContent = c.place;
      $('host').style.display = ''; $('me').style.left = '6%';
      $('hostImg').src = art(c.host, 'nestling'); $('hostTag').textContent = cap(c.host);
      $('meImg').src = art(bird.id, stage === 'egg' && c.activity === 'dressup' ? 'baby' : stage); $('meTag').textContent = bird.name;
      buildDots(); speak();
    }
    function speak() {
      var c = ch[idx];
      setSay(cap(c.host), c.host, c.beats[beat]);
      var last = beat >= c.beats.length - 1;
      controls([{ label: last ? 'Try it' : 'Next', fn: function () { if (last) startActivity(); else { beat++; speak(); } } }]);
    }
    function finishChapter() {
      var c = ch[idx]; activityDone = true; prog.visited[c.id] = true; save(prog); buildDots();
      $('learned').hidden = false; $('learned').textContent = '⭐ ' + fill(c.learned);
      var all = ch.every(function (x) { return prog.visited[x.id]; });
      var list = [{ label: c.cta.label, href: c.cta.href, cls: 'go' }];
      if (c.episode) list.push({ label: 'Watch the episode', href: c.episode, cls: 'alt' });
      if (idx < ch.length - 1) list.push({ label: 'Next place', cls: 'alt', fn: function () { go(idx + 1); } });
      else if (all) list.push({ label: 'Finish the story', cls: 'alt', fn: showFinale });
      controls(list);
    }
    function showFinale() {
      idx = -1; clearAct(); buildDots(); $('title').textContent = S.finale.title; $('host').style.display = 'none'; $('me').style.left = '40%';
      setSay(bird.name, bird.id, S.finale.lines.join(' '));
      controls([{ label: S.finale.cta.label, href: S.finale.cta.href, cls: 'go' }, { label: 'Explore again', cls: 'alt', fn: function () { showIntro(0); } }]);
    }

    /* ---------- activities: tiny versions of real app tools ---------- */
    function startActivity() {
      var c = ch[idx], act = $('act'); act.hidden = false; act.innerHTML = '';
      controls([]);
      ({ hello: hello, feelings: feelings, breathe: breathe, fireflies: fireflies, dressup: dressup, share: share })[c.activity](act);
    }
    function hello(act) {
      act.innerHTML = '<p style="margin:0 0 8px;font-weight:700">Tap {bird} to say hello!</p>'.replace('{bird}', bird.name);
      var me = $('me'); me.style.cursor = 'pointer';
      me.onclick = function () { me.classList.remove('hop'); void me.offsetWidth; me.classList.add('hop'); setSay(bird.name, bird.id, 'Hi ' + name + '! I am ' + bird.name + ', and I am yours.'); me.onclick = null; me.style.cursor = ''; finishChapter(); };
    }
    function feelings(act) {
      var set = [['Angry', '#f6b3a8'], ['Sad', '#b8d3f6'], ['Worried', '#f6e3a8'], ['Proud', '#bfe8cd'], ['Calm', '#d6c8f4']];
      var box = document.createElement('div'); box.className = 'leaves';
      set.forEach(function (f) {
        var b = document.createElement('button'); b.className = 'leaf'; b.type = 'button'; b.style.background = f[1]; b.textContent = '🍃 ' + f[0];
        b.onclick = function () { var d = FL ? FL.get(f[0]) : { comfort: 'That is okay.', ask: '' }; setSay(cap(ch[idx].host), ch[idx].host, d.comfort.replace(/\{bird\}/g, bird.name) + ' ' + d.ask); if (!activityDone) finishChapter(); };
        box.appendChild(b);
      });
      act.appendChild(box);
    }
    function breathe(act) {
      act.innerHTML = '<div id="orb">Ready?</div><p id="breathMsg" style="text-align:center;margin:6px 0 0;font-weight:800"></p>';
      var orb = $('orb'), msg = $('breathMsg'), n = 0; controls([{ label: 'Start breathing', fn: run }]);
      function run() {
        controls([]); n = 0; cycle();
      }
      function cycle() {
        if (n >= 3) { orb.textContent = 'Nice!'; orb.style.transform = 'scale(1)'; msg.textContent = ''; return finishChapter(); }
        orb.textContent = 'In'; msg.textContent = 'Breathe in slowly… (' + (n + 1) + ' of 3)'; orb.style.transform = 'scale(1.6)';
        setTimeout(function () { orb.textContent = 'Out'; msg.textContent = 'Now breathe out slowly…'; orb.style.transform = 'scale(1)'; setTimeout(function () { n++; cycle(); }, 4000); }, 4000);
      }
    }
    function fireflies(act) {
      var count = 0, need = 5; act.innerHTML = '<p id="ffMsg" style="margin:0;font-weight:800">Fireflies caught: 0 of 5</p>';
      var st = $('stage');
      for (var i = 0; i < need; i++) (function () {
        var f = document.createElement('button'); f.className = 'fly'; f.type = 'button'; f.setAttribute('aria-label', 'Catch a firefly');
        f.style.left = (14 + Math.random() * 70) + '%'; f.style.top = (22 + Math.random() * 46) + '%'; f.style.animationDelay = (Math.random() * 2) + 's';
        f.onclick = function () { f.remove(); count++; $('ffMsg').textContent = 'Fireflies caught: ' + count + ' of ' + need; if (count === need) finishChapter(); };
        st.appendChild(f);
      })();
    }
    function dressup(act) {
      var items = (G && G.CLOSET ? G.CLOSET : []).filter(function (i) { return ['bow', 'sunglasses', 'scarf', 'tophat'].indexOf(i.id) !== -1; });
      var BOX = { head: [4, 29, 42], face: [30, 27, 46], neck: [56, 29, 42] };
      var worn = {}; var me = $('me'), img = $('meImg');
      var wrap = document.createElement('div'); wrap.style.cssText = 'position:relative;height:calc(100% - 26px);display:inline-block'; img.parentNode.insertBefore(wrap, img); wrap.appendChild(img);
      var tryRow = document.createElement('div'); tryRow.className = 'try';
      items.forEach(function (it) {
        var uri = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + it.vb + '">' + it.svg + '</svg>');
        var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.innerHTML = '<img alt="" style="height:28px;width:auto" src="' + uri + '"> ' + it.name;
        b.onclick = function () {
          var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
          if (worn[it.id]) { worn[it.id].remove(); delete worn[it.id]; }
          if (on) { var o = document.createElement('img'), p = BOX[it.slot]; o.src = uri; o.alt = ''; o.style.cssText = 'position:absolute;pointer-events:none;top:' + p[0] + '%;left:' + p[1] + '%;width:' + p[2] + '%;height:auto'; wrap.appendChild(o); worn[it.id] = o; if (!activityDone) finishChapter(); }
        };
        tryRow.appendChild(b);
      });
      act.appendChild(tryRow);
    }
    function share(act) {
      act.innerHTML = '<p style="margin:0 0 6px;font-weight:700">Wave to a grown-up who cares about you:</p><button class="wave" type="button" aria-label="Wave to a grown-up">🧑‍🤝‍🧑 👋</button>';
      act.querySelector('.wave').onclick = function () { setSay(cap(ch[idx].host), ch[idx].host, 'They wave back! Showing a grown-up how you handled a big feeling is something to be proud of.'); if (!activityDone) finishChapter(); };
    }

    /* ---------- start ---------- */
    showIntro(0);
  })();
  </script>
</body>
</html>
