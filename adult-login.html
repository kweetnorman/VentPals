<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grown-up Log In – VentPals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="nav">
        <a class="brand" href="index.html" aria-label="VentPals home"><span class="mark" aria-hidden="true">🐦</span><span>VentPals</span></a>
        <a class="back" href="index.html">← Back</a>
      </div>
    </div>
  </header>

  <main>
    <section class="card" aria-label="Grown-up log in">
      <div class="card-head">
        <div class="icon" aria-hidden="true">🔐</div>
        <h1>Grown-up Log In</h1>
        <p class="subtitle">Manage your family's VentPals and your children's profiles.</p>
      </div>

      <form id="loginForm">
        <div id="errorBox" class="alert" role="alert"></div>
        <div id="okBox" class="ok" role="status"></div>

        <div>
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="jane@example.com" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <div class="hint"><a href="#" id="forgot" class="inline">Forgot your password?</a></div>
        </div>

        <button class="btn" id="submitBtn" type="submit">Log In</button>
      </form>

      <div class="foot">
        New to VentPals? <a href="adult-signup.html">Create a family account</a>
        <div style="margin-top:10px; font-size:12px;">
          Are you a kid? <a href="login.html">Pick your profile</a>
        </div>
      </div>
    </section>
  </main>

  <footer>VentPals • Supporting families with emotional growth.</footer>

  <script type="module">
    import { logInParent, resetPassword, friendlyAuthError } from './assets/js/vp-auth.js';

    const errorBox = document.getElementById('errorBox');
    const okBox = document.getElementById('okBox');
    const btn = document.getElementById('submitBtn');
    function show(box, msg) {
      errorBox.classList.remove('show'); okBox.classList.remove('show');
      box.textContent = msg; box.classList.add('show');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      try {
        await logInParent(document.getElementById('email').value.trim(),
                          document.getElementById('password').value);
        window.location.href = 'family.html';
      } catch (err) {
        show(errorBox, friendlyAuthError(err));
        btn.disabled = false;
      }
    });

    document.getElementById('forgot').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { show(errorBox, 'Type your email above first, then tap "Forgot your password?".'); return; }
      try {
        await resetPassword(email);
      } catch (err) { /* same message either way, so we don't reveal which emails exist */ }
      show(okBox, 'If that email has an account, a reset link is on its way. Check your inbox (and spam).');
    });
  </script>
</body>
</html>
