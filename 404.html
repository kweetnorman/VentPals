<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – VentPals</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom right, #f0f9ff, #F7F4FF);
    }
    .float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>

<body class="text-gray-800">

  <section class="text-center py-20 px-6">
    <img src="assets/album/stickers/breezy-sticker.png" width="839" height="900" decoding="async" alt="Breezy, a blue VentPal bird, looking for the page" class="float mx-auto mb-6" style="height:150px;width:auto">

    <h1 class="text-3xl font-bold text-purple-700 mb-4">Oops… this page flew away</h1>

    <p class="text-gray-600 max-w-md mx-auto text-sm mb-8">
      It looks like this page got lost in the wind.  
      Don’t worry — your VentPal can help you find your way back.
    </p>

    <a href="dashboard.html"
       class="inline-block bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-full">
      Back to Dashboard
    </a>
  </section>

</body>
</html>
