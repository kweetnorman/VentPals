<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Bird’s Growth – VentPals</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom right, #f0f9ff, #F7F4FF);
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .stage-active {
      border-color: #a855f7;
      background: #faf5ff;
    }

    .stage-complete {
      opacity: 0.6;
    }
  </style>
</head>

<body class="text-gray-800">
  <script>if(localStorage.getItem('ventpals_logged_in')!=='true'){window.location.replace('login.html');}</script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/growth.js"></script>

  <!-- NAV -->
  <nav class="bg-white/70 backdrop-blur-md shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2">
        <img src="assets/images/logo.png" class="h-8" alt="VentPals Logo">
        <span class="font-bold text-lg text-purple-700">VentPals</span>
      </a>

      <button class="sm:hidden text-purple-700 text-2xl" id="menuToggle">☰</button>

      <ul id="mobileMenu"
          class="hidden sm:flex flex-col sm:flex-row gap-4 text-sm font-semibold text-purple-700 sm:static absolute right-4 top-14 bg-white/90 sm:bg-transparent p-4 sm:p-0 rounded-xl shadow sm:shadow-none">
        <li><a href="profile.html" class="hover:text-purple-900">Profile</a></li>
        <li><a href="settings.html" class="hover:text-purple-900">Settings</a></li>
      </ul>
    </div>
  </nav>

  <script>
    document.getElementById('menuToggle').onclick = () => {
      document.getElementById('mobileMenu').classList.toggle('hidden');
    };
  </script>

  <!-- HEADER -->
  <section class="text-center pt-8 pb-4 px-4">
    <div id="heroArt" class="float flex justify-center items-center h-28"></div>
    <h1 id="birdName" class="text-3xl font-bold text-purple-700 mt-2 mb-1">Your VentPal</h1>
    <p id="stageLine" class="text-purple-500 font-semibold text-sm"></p>
    <p class="text-xs text-gray-400 mt-1">🔒 Your bird is yours for keeps. It grows as you do.</p>
  </section>

  <section class="max-w-xl mx-auto px-4 sm:px-6 pb-24 space-y-8">

    <!-- PROGRESS -->
    <div class="bg-white rounded-3xl shadow p-6">
      <div class="flex justify-between text-xs font-semibold text-purple-700 mb-2">
        <span id="xpLabel"></span><span id="nextLabel"></span>
      </div>
      <div class="w-full bg-purple-100 rounded-full h-4 overflow-hidden">
        <div id="xpBar" class="bg-purple-500 h-4 rounded-full transition-all duration-700" style="width:4%"></div>
      </div>
      <p id="xpHint" class="text-gray-600 text-sm mt-3"></p>
      <p id="streakLine" class="text-sm text-orange-600 font-semibold mt-1"></p>
    </div>

    <!-- STAGES -->
    <div>
      <h2 class="text-lg font-bold text-purple-700 mb-3">Growth stages</h2>
      <div id="stageList" class="space-y-3"></div>
    </div>

    <!-- WAYS TO GROW -->
    <div class="bg-white rounded-3xl shadow p-6">
      <h2 class="text-lg font-bold text-purple-700 mb-1">Ways to help your bird grow</h2>
      <p class="text-gray-500 text-xs mb-4">Each one counts once a day.</p>
      <ul id="waysList" class="space-y-2 text-sm"></ul>
    </div>

    <!-- BADGES -->
    <div class="bg-white rounded-3xl shadow p-6">
      <h2 class="text-lg font-bold text-purple-700 mb-1">Your badges</h2>
      <p id="badgeCount" class="text-gray-500 text-xs mb-4"></p>
      <div id="badgeGrid" class="grid grid-cols-3 gap-3"></div>
    </div>

    <a href="rewards.html" class="block text-center bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-full">🪶 My rewards and keepsakes</a>

    <a href="dashboard.html" class="block text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-full">Back to Home</a>
  </section>

  <script>
    (function () {
      var G = window.VPGrowth;
      if (!G) return;
      var bird = G.getBird(), p = G.getProgress();
      function art(stageId, cls) {
        var file = stageId === 'egg' ? 'egg' : stageId;
        return '<img src="assets/images/' + bird.id + '-' + file + '.png" class="' + (cls === 'hero' ? 'h-28' : 'h-16') + '" alt="" onerror="this.outerHTML=\'<span style=&quot;font-size:44px&quot;>' + (stageId === 'egg' ? '🥚' : bird.emoji) + '</span>\'">';
      }
      document.getElementById('heroArt').innerHTML = art(p.stage.id, 'hero');
      document.getElementById('birdName').textContent = bird.name;
      document.getElementById('stageLine').textContent = p.stage.name + ' stage';
      document.getElementById('xpLabel').textContent = p.xp + ' points';
      document.getElementById('nextLabel').textContent = p.next ? p.next.name + ' at ' + p.next.min : 'Fully grown!';
      document.getElementById('xpBar').style.width = Math.max(4, p.pct) + '%';
      document.getElementById('xpHint').textContent = p.next
        ? (p.stage.id === 'egg' ? 'Your egg is waiting to hatch. ' : '') + p.toNext + ' more points to reach ' + p.next.name + '.'
        : 'Your VentPal reached the top stage. Keep collecting badges!';
      var st = G.streak();
      document.getElementById('streakLine').textContent = st > 0 ? '🔥 ' + st + '-day streak' : '';

      var list = document.getElementById('stageList');
      G.STAGES.forEach(function (s, i) {
        var cls = i === p.index ? 'border-purple-400 bg-purple-50' : i < p.index ? 'border-green-300 opacity-70' : 'border-gray-200 opacity-50';
        var tag = i === p.index ? '<span class="text-xs font-bold text-purple-600">★ Now</span>' : i < p.index ? '<span class="text-xs font-bold text-green-600">✔ Done</span>' : '<span class="text-xs text-gray-400">' + s.min + ' points</span>';
        var d = document.createElement('div');
        d.className = 'bg-white rounded-3xl shadow p-4 border-2 flex items-center gap-4 ' + cls;
        d.innerHTML = '<div style="width:72px;text-align:center">' + art(s.id, 'small') + '</div><div class="flex-1"><div class="flex justify-between items-center"><h3 class="font-semibold text-purple-700">' + s.name + '</h3>' + tag + '</div><p class="text-gray-600 text-sm">' + s.blurb + '</p></div>';
        list.appendChild(d);
      });

      var ways = document.getElementById('waysList');
      Object.keys(G.ACTIVITIES).forEach(function (k) {
        var a = G.ACTIVITIES[k], li = document.createElement('li');
        li.className = 'flex justify-between bg-purple-50 rounded-xl px-3 py-2';
        li.innerHTML = '<span>' + a.label + '</span><span class="font-bold text-purple-600">+' + a.xp + '</span>';
        ways.appendChild(li);
      });

      var grid = document.getElementById('badgeGrid'), have = 0, total = Object.keys(G.BADGES).length;
      Object.keys(G.BADGES).forEach(function (k) {
        var b = G.BADGES[k], got = !!p.badges[k]; if (got) have++;
        var d = document.createElement('div');
        d.className = 'text-center rounded-2xl p-3 border-2 ' + (got ? 'border-yellow-300 bg-yellow-50' : 'border-gray-200 bg-gray-50');
        d.innerHTML = '<div style="font-size:30px;' + (got ? '' : 'filter:grayscale(1);opacity:.35') + '">' + b.icon + '</div><p class="text-xs font-bold ' + (got ? 'text-purple-700' : 'text-gray-400') + ' mt-1">' + b.name + '</p><p class="text-[10px] text-gray-400">' + (got ? 'Earned!' : b.how) + '</p>';
        grid.appendChild(d);
      });
      document.getElementById('badgeCount').textContent = have + ' of ' + total + ' collected';
    })();
  </script>

</body>
</html>
